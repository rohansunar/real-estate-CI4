<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Direct AJAX Delete</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        #log { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Test Direct AJAX Delete</h1>
    
    <div class="test-section">
        <h3>Instructions:</h3>
        <ol>
            <li>Make sure you're logged into the dashboard</li>
            <li>Open browser developer tools (F12) to see console logs</li>
            <li>Click the test button below</li>
        </ol>
    </div>
    
    <div class="test-section">
        <h3>Test Delete Enquiry ID 62:</h3>
        <button onclick="testDelete(62)">Test Delete Enquiry 62</button>
        <div id="result"></div>
        <div id="log"></div>
    </div>

    <script>
        function log(message) {
            console.log(message);
            const logDiv = document.getElementById('log');
            logDiv.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
        }

        async function testDelete(enquiryId) {
            const resultDiv = document.getElementById('result');
            const logDiv = document.getElementById('log');
            
            logDiv.textContent = ''; // Clear previous logs
            resultDiv.innerHTML = '<div class="info">Testing delete...</div>';
            
            log('Starting delete test for enquiry ID: ' + enquiryId);
            
            const url = `http://localhost:8081/dashboard/enquiries/${enquiryId}`;
            log('DELETE URL: ' + url);
            
            try {
                log('Sending DELETE request...');
                
                const response = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    credentials: 'include' // Include cookies for authentication
                });
                
                log('Response received');
                log('Status: ' + response.status);
                log('Status Text: ' + response.statusText);
                log('Headers: ' + JSON.stringify([...response.headers.entries()]));
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                log('Response data: ' + JSON.stringify(data));
                
                if (data.success) {
                    resultDiv.innerHTML = '<div class="success">✅ SUCCESS: Enquiry deleted successfully!</div>';
                    log('Delete successful');
                } else {
                    resultDiv.innerHTML = '<div class="error">❌ FAILED: ' + (data.message || 'Unknown error') + '</div>';
                    log('Delete failed: ' + (data.message || 'Unknown error'));
                }
                
            } catch (error) {
                log('Error caught: ' + error.message);
                console.error('Full error:', error);
                resultDiv.innerHTML = '<div class="error">❌ Error: ' + error.message + '</div>';
            }
        }
    </script>
</body>
</html>
